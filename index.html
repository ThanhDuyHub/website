<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThanhDuyHub - Scripts List</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: #05050a;
            color: #fff;
        }

        /* Language Toggle */
        .lang-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            background: rgba(15, 23, 42, 0.8);
            border-radius: 30px;
            border: 1px solid rgba(129, 140, 248, 0.3);
            overflow: hidden;
        }

        .lang-toggle button {
            padding: 8px 20px;
            border: none;
            background: transparent;
            color: #a5b4fc;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .lang-toggle button.active {
            background: linear-gradient(135deg, #4f46e5, #6366f1);
            color: #fff;
        }

        /* 3D Anime Background */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0c0c1e 0%, #1a1a3c 50%, #0f0f23 100%);
        }

        /* Floating stars */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* Floating particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            perspective: 1000px;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.4), rgba(168, 85, 247, 0.3));
            box-shadow: 0 0 20px rgba(129, 140, 248, 0.2);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-100vh) rotate(360deg); opacity: 0; }
        }

        /* Glowing orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            animation: pulse 8s infinite ease-in-out;
        }

        .orb-1 {
            width: 400px;
            height: 400px;
            background: rgba(79, 70, 229, 0.15);
            top: 10%;
            left: 10%;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: rgba(168, 85, 247, 0.1);
            bottom: 10%;
            right: 10%;
            animation-delay: -4s;
        }

        .orb-3 {
            width: 300px;
            height: 300px;
            background: rgba(56, 189, 248, 0.08);
            top: 50%;
            left: 50%;
            animation-delay: -2s;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.2); }
        }

        /* Gradient overlay */
        .gradient-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at top, transparent 40%, rgba(12, 12, 30, 0.7) 100%);
            z-index: 1;
        }

        /* Main Content */
        .content {
            position: relative;
            z-index: 10;
            max-width: 900px;
            margin: 0 auto;
            padding: 60px 20px;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 60px;
        }

        .logo {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #818cf8, #c084fc, #67e8f9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(129, 140, 248, 0.2);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a5b4fc;
            font-size: 1.1rem;
        }

        .section-title {
            font-size: 1.5rem;
            color: #c7d2fe;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(99, 102, 241, 0.3);
        }

        /* Script Cards */
        .scripts-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 50px;
        }

        .script-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.25);
            border-radius: 16px;
            padding: 25px 30px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .script-card:hover {
            border-color: rgba(129, 140, 248, 0.5);
            transform: translateY(-4px);
            box-shadow: 0 10px 40px rgba(79, 70, 229, 0.15);
        }

        .script-name {
            font-size: 1.4rem;
            font-weight: 600;
            color: #e0e7ff;
            margin-bottom: 8px;
        }

        .script-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 18px;
        }

        .get-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #fff;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(79, 70, 229, 0.3);
        }

        .get-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(79, 70, 229, 0.4);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 200;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.show {
            opacity: 1;
            visibility: visible;
        }

        .modal {
            background: linear-gradient(135deg, #1e1b47, #1a1835);
            border: 1px solid rgba(129, 140, 248, 0.3);
            border-radius: 20px;
            padding: 40px;
            max-width: 480px;
            width: 90%;
            transform: scale(0.9);
            transition: transform 0.3s ease;
            box-shadow: 0 0 60px rgba(79, 70, 229, 0.2);
        }

        .modal-overlay.show .modal {
            transform: scale(1);
        }

        .modal-title {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 30px;
            color: #e0e7ff;
        }

        .link-option {
            display: block;
            width: 100%;
            padding: 18px 25px;
            margin-bottom: 15px;
            background: rgba(30, 27, 71, 0.8);
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 10px;
            color: #c7d2fe;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .link-option:hover {
            border-color: rgba(167, 139, 250, 0.6);
            background: rgba(49, 46, 129, 0.6);
            transform: translateX(5px);
        }

        .link-option.vn {
            border-left: 3px solid #f87171;
        }

        .link-option.global {
            border-left: 3px solid #60a5fa;
        }

        .close-btn {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid rgba(148, 163, 184, 0.4);
            color: #94a3b8;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            border-color: #cbd5e1;
            color: #e2e8f0;
        }

        .flag {
            margin-right: 10px;
            font-size: 1.2rem;
        }

        /* Hidden text elements for language switching */
        [data-vi] { display: none; }
        html[lang="vi"] [data-en] { display: none; }
        html[lang="vi"] [data-vi] { display: block; }
        html[lang="en"] [data-en] { display: block; }
    </style>
</head>
<body>
    <!-- Language Toggle -->
    <div class="lang-toggle">
        <button id="btnEn" class="active">EN</button>
        <button id="btnVi">VI</button>
    </div>

    <!-- 3D Anime Background -->
    <div class="bg-container">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
        <div class="stars" id="starsContainer"></div>
        <div class="particles" id="particlesContainer"></div>
    </div>
    <div class="gradient-overlay"></div>

    <!-- Main Content -->
    <div class="content">
        <div class="header">
            <h1 class="logo">ThanhDuyHub</h1>
            <p class="subtitle" data-en>Premium Scripts Collection</p>
            <p class="subtitle" data-vi>Bộ Sưu Tập Script Chất Lượng</p>
        </div>

        <h2 class="section-title" data-en>📋 Available Scripts</h2>
        <h2 class="section-title" data-vi>📋 Danh Sách Script</h2>

        <div class="scripts-list">
            <!-- LoopDash V4 -->
            <div class="script-card">
                <h3 class="script-name">🎮 LoopDash V4</h3>
                <p class="script-desc" data-en>Advanced script for LoopDash game</p>
                <p class="script-desc" data-vi>Script nâng cao cho game LoopDash</p>
                <button class="get-btn" onclick="openModal()">
                    <span data-en>Get Script LoopDash V4</span>
                    <span data-vi>Lấy Script LoopDash V4</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Link Selection Modal -->
    <div class="modal-overlay" id="linkModal">
        <div class="modal">
            <h3 class="modal-title" data-en>🌐 Choose Your Link</h3>
            <h3 class="modal-title" data-vi>🌐 Chọn Link Của Bạn</h3>
            
            <button class="link-option global" onclick="goToLink('global')">
                <span class="flag">🌍</span>
                <span data-en>Community Link</span>
                <span data-vi>Link Cộng Đồng</span>
            </button>
            
            <button class="link-option vn" onclick="goToLink('vn')">
                <span class="flag">🇻🇳</span>
                <span data-en>Vietnam Link</span>
                <span data-vi>Link Việt Nam</span>
            </button>
            
            <button class="close-btn" onclick="closeModal()">
                <span data-en>Close</span>
                <span data-vi>Đóng</span>
            </button>
        </div>
    </div>

    <script>
        // Language System
        const html = document.documentElement;
        const btnEn = document.getElementById('btnEn');
        const btnVi = document.getElementById('btnVi');

        function setLanguage(lang) {
            html.setAttribute('lang', lang);
            btnEn.classList.toggle('active', lang === 'en');
            btnVi.classList.toggle('active', lang === 'vi');
            localStorage.setItem('preferredLang', lang);
        }

        btnEn.addEventListener('click', () => setLanguage('en'));
        btnVi.addEventListener('click', () => setLanguage('vi'));

        // Load saved language
        const savedLang = localStorage.getItem('preferredLang') || 'en';
        setLanguage(savedLang);

        // Modal Functions
        function openModal() {
            document.getElementById('linkModal').classList.add('show');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            document.getElementById('linkModal').classList.remove('show');
            document.body.style.overflow = '';
        }

        function goToLink(type) {
            if (type === 'global') {
                window.open('https://kys.linkvertise.lol/DTOM/a9a82371-f57f-40ca-939e-f34e6fead6f4#Dashboard', '_blank');
            } else {
                window.open('https://link4sub.com/loopdashv4', '_blank');
            }
            closeModal();
        }

        // Close modal when clicking outside
        document.getElementById('linkModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // Generate Stars
        const starsContainer = document.getElementById('starsContainer');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 3 + 's';
            star.style.width = (Math.random() * 2 + 1) + 'px';
            star.style.height = star.style.width;
            starsContainer.appendChild(star);
        }

        // Generate Floating Particles
        const particlesContainer = document.getElementById('particlesContainer');
        for (let i = 0; i < 40; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            const size = Math.random() * 60 + 20;
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.left = Math.random() * 100 + '%';
            particle.style.animationDelay = Math.random() * 15 + 's';
            particle.style.animationDuration = (Math.random() * 10 + 10) + 's';
            particle.style.opacity = Math.random() * 0.4 + 0.05;
            particlesContainer.appendChild(particle

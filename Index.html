<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ThanhDuyHub</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background: #0a0a0f;
        }

        /* ===== 3D Anime Background ===== */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 50%, #16213e 100%);
        }

        /* Floating stars */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .star {
            position: absolute;
            width: 3px;
            height: 3px;
            background: #fff;
            border-radius: 50%;
            animation: twinkle 3s infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* 3D Floating geometric shapes */
        .shapes-container {
            position: absolute;
            width: 100%;
            height: 100%;
            perspective: 800px;
        }

        .shape {
            position: absolute;
            transform-style: preserve-3d;
            animation: float 20s infinite ease-in-out;
        }

        .pyramid {
            width: 0;
            height: 0;
            border-left: 50px solid transparent;
            border-right: 50px solid transparent;
            border-bottom: 85px solid rgba(255, 183, 77, 0.1);
            filter: drop-shadow(0 0 20px rgba(255, 183, 77, 0.2));
        }

        .cube-shape {
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, rgba(120, 170, 255, 0.08), rgba(180, 120, 255, 0.08));
            border: 1px solid rgba(150, 180, 255, 0.15);
            transform-style: preserve-3d;
            animation: rotateCube 15s infinite linear;
            box-shadow: 0 0 30px rgba(120, 170, 255, 0.05) inset;
        }

        .ring {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid transparent;
            border-top-color: rgba(255, 150, 180, 0.2);
            border-right-color: rgba(150, 180, 255, 0.15);
            animation: spinRing 12s infinite linear;
        }

        .ring-2 {
            width: 90px;
            height: 90px;
            border-color: transparent;
            border-bottom-color: rgba(120, 255, 200, 0.15);
            border-left-color: rgba(255, 200, 100, 0.12);
            animation-direction: reverse;
            animation-duration: 9s;
        }

        @keyframes float {
            0% { transform: translateY(0px) translateX(0px) rotateX(0deg) rotateY(0deg); }
            25% { transform: translateY(-30px) translateX(20px) rotateX(5deg) rotateY(10deg); }
            50% { transform: translateY(-10px) translateX(-15px) rotateX(-5deg) rotateY(5deg); }
            75% { transform: translateY(-40px) translateX(10px) rotateX(3deg) rotateY(-5deg); }
            100% { transform: translateY(0px) translateX(0px) rotateX(0deg) rotateY(0deg); }
        }

        @keyframes rotateCube {
            0% { transform: rotateX(0deg) rotateY(0deg); }
            100% { transform: rotateX(360deg) rotateY(360deg); }
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Aurora glow */
        .aurora {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(ellipse at 20% 20%, rgba(100, 60, 200, 0.08) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(60, 100, 180, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 90%, rgba(200, 80, 120, 0.04) 0%, transparent 40%);
            animation: auroraShift 15s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes auroraShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /* ===== Main Content ===== */
        .content-wrapper {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            padding: 40px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .header {
            text-align: center;
            margin-bottom: 50px;
        }

        .logo-title {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #7dd3fc, #a78bfa, #f9a8d4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 4px;
            text-shadow: 0 0 40px rgba(167, 139, 250, 0.2);
            margin-bottom: 10px;
        }

        .subtitle {
            color: #a5b4fc;
            font-size: 1.1rem;
            letter-spacing: 2px;
            opacity: 0.8;
        }

        /* Script List Container */
        .scripts-container {
            width: 100%;
            max-width: 700px;
        }

        .section-title {
            color: #e0e7ff;
            font-size: 1.4rem;
            margin-bottom: 25px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(129, 140, 248, 0.2);
        }

        .script-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(99, 102, 241, 0.2);
            border-radius: 16px;
            padding: 25px 30px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .script-card:hover {
            border-color: rgba(129, 140, 248, 0.4);
            transform: translateY(-4px);
            box-shadow: 0 8px 30px rgba(99, 102, 241, 0.15);
        }

        .script-name {
            color: #e0e7ff;
            font-size: 1.3rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .script-desc {
            color: #94a3b8;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .get-btn {
            display: inline-block;
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: #ffffff;
            text-decoration: none;
            padding: 12px 35px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            border: none;
            cursor: pointer;
        }

        .get-btn:hover {
            background: linear-gradient(135deg, #4338ca, #6d28d9);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .coming-soon {
            color: #64748b;
            font-size: 0.9rem;
            font-style: italic;
            padding: 10px 0;
        }

        .footer {
            margin-top: 60px;
            color: #636680;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- ===== 3D Anime Background ===== -->
    <div class="bg-container">
        <div class="aurora"></div>
        
        <!-- Stars -->
        <div class="stars" id="stars"></div>
        
        <!-- Floating 3D Shapes -->
        <div class="shapes-container">
            <div class="shape" style="top: 15%; left: 10%; animation-delay: 0s;">
                <div class="cube-shape"></div>
            </div>
            <div class="shape" style="top: 70%; left: 85%; animation-delay: -5s;">
                <div class="ring"></div>
            </div>
            <div class="shape" style="top: 30%; left: 80%; animation-delay: -8s;">
                <div class="ring ring-2"></div>
            </div>
            <div class="shape" style="top: 75%; left: 15%; animation-delay: -3s;">
                <div class="cube-shape" style="opacity: 0.6;"></div>
            </div>
            <div class="shape" style="top: 20%; left: 60%; animation-delay: -10s;">
                <div class="pyramid"></div>
            </div>
            <div class="shape" style="top: 60%; left: 25%; animation-delay: -7s;">
                <div class="ring" style="border-top-color: rgba(120, 220, 255, 0.18);"></div>
            </div>
        </div>
    </div>

    <!-- ===== Main Content ===== -->
    <div class="content-wrapper">
        <div class="header">
            <h1 class="logo-title">ThanhDuyHub</h1>
            <p class="subtitle">Scripts Collection</p>
        </div>

        <div class="scripts-container">
            <h2 class="section-title">Available Scripts</h2>

            <!-- LoopDash V4 Script Card -->
            <div class="script-card">
                <h3 class="script-name">LoopDash V4</h3>
                <p class="script-desc">Advanced script for LoopDash game. Full features and constant updates.</p>
                <a href="https://kys.linkvertise.lol/DTOM/a9a82371-f57f-40ca-939e-f34e6fead6f4#Dashboard" 
                   target="_blank" class="get-btn">Get Script</a>
            </div>

            <!-- More Scripts Placeholder -->
            <div class="script-card">
                <h3 class="script-name">More Scripts</h3>
                <p class="script-desc">New scripts will be added soon. Stay updated!</p>
                <p class="coming-soon">Coming Soon...</p>
            </div>
        </div>

        <div class="footer">
            © 2026 ThanhDuyHub. All rights reserved.
        </div>
    </div>

    <!-- ===== Generate Stars ===== -->
    <script>
        // Create twinkling stars
        const starsContainer = document.getElementById('stars');
        const starCount = 150;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            
            const size = Math.random() * 3 + 1;
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const delay = Math.random() * 3;
            const duration = Math.random() * 2 + 2;
            
            star.style.left = posX + '%';
            star.style.top = posY + '%';
            star.style.width = size + 'px';
            star.style.height = size + 'px';
            star.style.animationDelay = delay + 's';
            star.style.animationDuration = duration + 's';
            
            starsContainer.appendChild(star);
        }
    </script>
</body>
</html>
